name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: ubuntu
            version: "22.04"
            package_format: deb
            qt_version: qt5
          - distro: ubuntu
            version: "24.04"
            package_format: deb
            qt_version: qt6
          - distro: debian
            version: "12"
            package_format: deb
            qt_version: qt6
          - distro: fedora
            version: "41"
            package_format: rpm
            qt_version: qt6
          - distro: archlinux
            version: "latest"
            package_format: pkg.tar.zst
            qt_version: qt6
    
    container:
      image: ${{ matrix.distro }}:${{ matrix.version }}
    
    steps:
      - name: Install dependencies (Debian/Ubuntu Qt5)
        if: matrix.package_format == 'deb' && matrix.qt_version == 'qt5'
        run: |
          apt-get update && apt-get install -y \
            build-essential \
            cmake \
            git \
            libdbusmenu-qt5-dev \
            libpulse-dev \
            libqt5x11extras5-dev \
            libquazip5-dev \
            libudev-dev \
            libxcb-ewmh-dev \
            libxcb-screensaver0-dev \
            libxcb1-dev \
            qtbase5-dev \
            qttools5-dev \
            zlib1g-dev \
            dpkg-dev \
            file

      - name: Install dependencies (Debian/Ubuntu Qt6)
        if: matrix.package_format == 'deb' && matrix.qt_version == 'qt6'
        run: |
          apt-get update && apt-get install -y \
            build-essential \
            cmake \
            git \
            libpulse-dev \
            libquazip1-qt6-dev \
            libudev-dev \
            libxcb-ewmh-dev \
            libxcb-screensaver0-dev \
            libxcb1-dev \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-tools-dev \
            qt6-wayland \
            qt6-wayland-dev \
            wayland-protocols \
            zlib1g-dev \
            dpkg-dev \
            file

      - name: Install dependencies (Fedora Qt6)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y \
            cmake \
            gcc \
            gcc-c++ \
            git \
            glibc \
            libxcb-devel \
            libpulse \
            libxcb-devel \
            make \
            pulseaudio-libs-devel \
            qt6-linguist \
            qt6-qtbase-devel \
            qt6-qttools-devel \
            qt6-qtwayland-devel \
            quazip-qt6-devel \
            rpm-build \
            systemd-devel \
            wayland-devel \
            wayland-protocols-devel \
            xcb-util-devel \
            xcb-util-wm-devel \
            zlib-devel

      - name: Install dependencies (Arch Linux Qt6)
        if: matrix.distro == 'archlinux'
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            cmake \
            gcc \
            git \
            libpulse \
            libsystemd \
            libxcb \
            qt6-base \
            qt6-tools \
            qt6-wayland \
            quazip-qt6 \
            wayland-protocols \
            xcb-util-wm \
            zlib

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ckb-next
        run: |
          mkdir -p build
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_EXPERIMENTAL=ON \
            -DCMAKE_INSTALL_PREFIX=/usr \
            ..
          make -j$(nproc)
      
      - name: Create DEB package
        if: matrix.package_format == 'deb'
        run: |
          cd build
          cpack -G DEB
          mkdir -p ../artifacts
          mv *.deb ../artifacts/ || true
      
      - name: Create RPM package
        if: matrix.package_format == 'rpm'
        run: |
          cd build
          cpack -G RPM
          mkdir -p ../artifacts
          mv *.rpm ../artifacts/ || true
      
      - name: Create Arch Linux package
        if: matrix.package_format == 'pkg.tar.zst'
        run: |
          cd build
          make install DESTDIR=../pkgdir
          mkdir -p ../artifacts
          
          # Get installed size
          PKGDIR_SIZE=$(du -sb ../pkgdir | cut -f1)
          
          # Create .PKGINFO
          cat > ../pkgdir/.PKGINFO << EOF
          pkgname = ckb-next
          pkgver = ${{ github.ref_name }}
          pkgdesc = ckb-next driver for Corsair keyboards and mice (with Ironclaw Wireless SE support)
          url = https://github.com/zacpr/ckb-next
          builddate = $(date +%s)
          packager = ZacPr <zac@ashurtech.net>
          size = ${PKGDIR_SIZE}
          arch = x86_64
          license = GPL-2.0
          depend = qt6-base
          depend = qt6-svg
          depend = quazip-qt6
          depend = libusb
          depend = systemd-libs
          EOF
          
          # Create package using makepkg-style tarball
          cd ../pkgdir
          tar --use-compress-program=zstd -cf ../artifacts/ckb-next-${{ github.ref_name }}-1-x86_64.pkg.tar.zst \
            --uid 0 --gid 0 \
            .PKGINFO usr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ckb-next-${{ matrix.distro }}-${{ matrix.version }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

  create-release:
    name: Create Release
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      
      - name: List artifacts
        run: find ./artifacts -type f
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}
            
            This release adds support for the **Corsair IRONCLAW RGB WIRELESS SE Gaming Mouse** (USB ID: 1b1c:2b32).
            
            ### New Device Support
            - **Product ID:** 1b1c:2b32 (Wired mode)
            - **Protocol:** Bragi
            - **LED Zones:** 6
            - **DPI:** 18000
            - **Status:** Experimental (requires `--enable-experimental` flag)
            
            ### Installation
            
            Download the package for your distribution and install using your package manager.
            
            ### Supported Distributions:
            - Ubuntu 22.04 / 24.04
            - Debian 12
            - Fedora 41
            - Arch Linux
            
            ### Device Support
            
            **New Device:**
            - **Corsair IRONCLAW RGB WIRELESS SE** (1b1c:2b32)
              - Protocol: Bragi
              - LED Zones: 6
              - DPI: 18000
              - Status: Experimental (requires `--enable-experimental` flag)
            
            **To enable experimental support:**
            ```bash
            ckb-next --enable-experimental
            ```
            
            ## Testing
            
            Please test and report issues at: https://github.com/zacpr/ckb-next/issues
            
            ## Changes from Upstream
            
            - Added support for Corsair IRONCLAW RGB WIRELESS SE Gaming Mouse
            - All changes are marked as experimental
            - Uses the same Bragi protocol as existing Ironclaw Wireless
            
            For full details, see the commit history.
          files: ./artifacts/**
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
