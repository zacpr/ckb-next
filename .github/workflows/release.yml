name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'ubuntu:22.04'
          - 'ubuntu:24.04'
          - 'debian:12'
          - 'fedora:41'
          - 'archlinux:latest'
        build_type:
          - Release
        compiler:
          - GNU
      fail-fast: false
    
    container:
      env:
        BUILD_TYPE: ${{ matrix.build_type || 'Release' }}
        CC: ${{ matrix.compiler == 'LLVM' && 'clang' || 'gcc' }}
        CXX: ${{ matrix.compiler == 'LLVM' && 'clang++' || 'g++' }}
      image: ${{ matrix.image }}
    
    steps:
      - name: Install `git`
        run: |
          if command -v apt-get &> /dev/null; then
            apt-get --quiet --quiet update && apt-get --quiet --quiet install git
          elif command -v pacman &> /dev/null; then
            pacman --sync --refresh --sysupgrade --noconfirm git
          elif command -v dnf &> /dev/null; then
            dnf --assumeyes install git
          elif command -v apk &> /dev/null; then
            apk add git bash
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/dependencies/install

      - name: Build `ckb-next`
        run: |
          mkdir -p build
          cd build
          cmake \
            -S .. \
            -B . \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE:-Release} \
            -DFORCE_INIT_SYSTEM=systemd \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSAFE_INSTALL=ON \
            -DSAFE_UNINSTALL=ON \
            -DENABLE_EXPERIMENTAL=ON \
            ..
          make -j$(nproc)
        shell: bash --noprofile --norc -euxo pipefail {0}

      - name: Install `ckb-next`
        uses: ./.github/actions/cmake/install

      - name: Run `ckb-next-daemon --help`
        run: |
          ckb-next-daemon --help

      - name: Package `ckb-next`
        uses: ./.github/actions/cmake/package

      - name: Upload `ckb-next` package to workflow artifacts
        uses: ./.github/actions/upload-package

  create-release:
    name: Create Release
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      
      - name: List artifacts
        run: find ./artifacts -type f
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}
            
            This release adds support for the **Corsair IRONCLAW RGB WIRELESS SE Gaming Mouse** (USB ID: 1b1c:2b32).
            
            ### New Device Support
            - **Product ID:** 1b1c:2b32 (Wired mode)
            - **Protocol:** Bragi
            - **LED Zones:** 6
            - **DPI:** 18000
            - **Status:** Experimental (requires `--enable-experimental` flag)
            
            ### Installation
            
            Download the package for your distribution and install using your package manager.
            
            ### Supported Distributions:
            - Ubuntu 22.04 / 24.04
            - Debian 12
            - Fedora 41
            - Arch Linux
            
            ### Device Support
            
            **New Device:**
            - **Corsair IRONCLAW RGB WIRELESS SE** (1b1c:2b32)
              - Protocol: Bragi
              - LED Zones: 6
              - DPI: 18000
              - Status: Experimental (requires `--enable-experimental` flag)
            
            **To enable experimental support:**
            ```bash
            ckb-next --enable-experimental
            ```
            
            ## Testing
            
            Please test and report issues at: https://github.com/zacpr/ckb-next/issues
            
            ## Changes from Upstream
            
            - Added support for Corsair IRONCLAW RGB WIRELESS SE Gaming Mouse
            - All changes are marked as experimental
            - Uses the same Bragi protocol as existing Ironclaw Wireless
            
            For full details, see the commit history.
          files: ./artifacts/**
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
